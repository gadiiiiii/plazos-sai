name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-y-build:
    name: Tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de la lógica de plazos
        run: npm test

      - name: Build de producción
        run: npm run build
